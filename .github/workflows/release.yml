name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build Universal .app, .dmg, and .zip
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
          CODESIGN_IDENTITY: "-"
        run: |
          CLEAN_VERSION="${VERSION#v}"
          chmod +x scripts/build_app.sh
          VERSION="$CLEAN_VERSION" ./scripts/build_app.sh --universal --dmg --zip

      - name: Upload GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/WorktreeCleaner.dmg
            dist/WorktreeCleaner-macOS.zip
