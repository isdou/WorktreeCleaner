name: Release macOS App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Run unit tests
        run: swift test

      - name: Build Universal .app, .dmg, and .zip
        env:
          VERSION: ${{ inputs.tag }}
          CODESIGN_IDENTITY: "-"
        run: |
          CLEAN_VERSION="${VERSION#v}"
          chmod +x scripts/build_app.sh
          VERSION="$CLEAN_VERSION" ./scripts/build_app.sh --universal --dmg --zip

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          overwrite_files: false
          files: |
            dist/WorktreeCleaner.dmg
            dist/WorktreeCleaner-macOS.zip
